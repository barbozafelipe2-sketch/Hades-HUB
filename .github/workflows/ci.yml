name: KAIROS CI

on:
  push:
    branches: [main, kairos-commercial-hardening]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kairos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kairos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KAIROS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kairos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
